services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: learning_coach
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/learning_coach
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: